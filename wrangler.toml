name = "md-2-pdf"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./public"

[vars]
ENVIRONMENT = "production"
# External Render service that prints HTML -> PDF (headless Chromium).
# Replace with your real Render URL after deploy, e.g. https://md2pdf.onrender.com
RENDER_PDF_URL = "https://REPLACE-ME.onrender.com"

# ── D1 Database ──────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "md2pdf-db"
database_id = "5b623cd0-f45f-4d71-8585-46904f62ed18"

# ── Development ──────────────────────────────────────────────────────────────
[dev]
port = 3000